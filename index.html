<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026年 年間スケジュール | GTA</title>


    <style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    background: #ffffff;
    color: #333;
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  /* 見出しをGTAグリーン */
  h1, h2 {
    color: #1f7a34;
  }

  .org {
    color: #555;
    margin-bottom: 24px;
  }

  .meta {
    font-size: 14px;
    color: #555;
    margin-bottom: 32px;
  }

  .box {
    background: #f5f5f5;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    margin-bottom: 32px;
  }

  .box h2 {
    font-size: 20px;
    margin-bottom: 16px;
  }

  .calendar {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  .month {
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    background: #ffffff;
  }

  .month strong {
    display: block;
    margin-bottom: 6px;
  }

  .month a {
    display: inline-block;
    margin-top: 4px;
    font-size: 13px;
    color: #1f7a34;
    text-decoration: none;
  }

  .month a:hover {
    text-decoration: underline;
    color: #2e9e44;
  }

  /* ダウンロードボタン */
  .download {
    display: inline-block;
    padding: 12px 20px;
    background: #1f7a34;
    color: #fff;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }

  .download:hover {
    background: #2e9e44;
  }

  .note {
    font-size: 14px;
    color: #444;
    line-height: 1.6;
  }

  footer {
    margin-top: 48px;
    font-size: 13px;
    color: #666;
  }
</style>

  
</head>

<body>
<header class="header">
 <a href="https://globaltaxassoc.org/" target="_blank">
