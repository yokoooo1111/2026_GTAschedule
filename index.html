<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026年 年間スケジュール | GTA</title>


    <style>
 body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0;
  background: #f4f8f6;
  color: #333;
}

.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 60px 20px 100px;
}

h1 {
  color: #1f7a34;
  font-size: 36px;
  margin-bottom: 10px;
}

.org {
  color: #666;
  margin-bottom: 10px;
}

.meta {
  font-size: 14px;
  color: #888;
  margin-bottom: 50px;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 28px;
}

.month {
  position: relative;
  background: #ffffff;
  border-radius: 22px;
  padding: 26px 24px 28px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.05);
  transition: 0.3s ease;
  border-top: 4px solid #1f7a34;   /* ← 緑ライン */
}

.month:hover {
  transform: translateY(-6px);
  box-shadow: 0 22px 45px rgba(0,0,0,0.08);
}

.month strong {
  font-size: 20px;
  color: #1f7a34;
  display: block;
  margin-bottom: 16px;
}

/* 開催予定ありバッジ */
.badge {
  position: absolute;
  top: 18px;
  right: 20px;
  background: #1f7a34;
  color: #fff;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 999px;
}

/* イベント縦ライン */
.event {
  position: relative;
  padding-left: 14px;
  margin-bottom: 18px;
  font-size: 14px;
  line-height: 1.6;
}

.event::before {
  content: "";
  position: absolute;
  left: 0;
  top: 4px;
  bottom: 4px;
  width: 3px;
  background: #1f7a34;
  border-radius: 2px;
}

/* 詳細ボタン */
.detail {
  display: inline-block;
  margin-top: 6px;
  padding: 6px 14px;
  background: #1f7a34;
  color: #fff;
  font-size: 12px;
  border-radius: 999px;
  text-decoration: none;
  transition: 0.2s;
}

.detail:hover {
  background: #2e9e44;
}

/* 4月だけ強調 */
.highlight {
  background: #e9f5ee;
  border-top: 4px solid #0f5c24;
  box-shadow: 0 22px 50px rgba(0,0,0,0.08);
}

footer {
  margin-top: 80px;
  text-align: center;
  font-size: 13px;
  color: #777;
}
</style>

  
</head>

<body>
<header class="header">
 <a href="https://globaltaxassoc.org/" target="_blank">

</a>

  
</header>
  <div class="wrap">

<div class="calendar">

  <div class="month"><strong>3月</strong></div>

<div class="month highlight">

  <div class="event">

       target="_blank"

  </div>

  <div class="event">
    定例会1　4/3(金)<br>

       target="_blank"
       class="detail">詳細を見る</a>

</div>

  <div class="month"><strong>5月</strong></div>
  <div class="month"><strong>6月</strong></div>

  <div class="month has-event">
    <strong>7月</strong>
    <span class="coming">準備中</span>
  </div>

  <div class="month"><strong>8月</strong></div>

  <div class="month has-event">

    <span class="coming">準備中</span>
  </div>

  <div class="month has-event">
    <strong>10月</strong>

  <div class="month has-event">
    <strong>11月</strong>

</div>
</div>
